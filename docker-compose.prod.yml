# Produção (VPS). Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Sem "ports": o banco fica acessível só pela rede interna do Docker.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    # DNS público: o 127.0.0.53 copiado do servidor não funciona dentro do contêiner
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_ADMIN_LOGIN: ${APP_ADMIN_LOGIN}
      APP_ADMIN_SENHA: ${APP_ADMIN_SENHA}
      # Atrás do Caddy (HTTPS): confia nos cabeçalhos X-Forwarded-* e marca o cookie como Secure
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
    # Sem "ports": só o Caddy acessa o backend.

  web:
    build: ./frontend
    restart: unless-stopped
    # DNS público: o 127.0.0.53 copiado do servidor não funciona dentro do contêiner
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - backend
    environment:
      DOMINIO: ${DOMINIO}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
